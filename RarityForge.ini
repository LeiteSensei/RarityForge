; RarityForge - configuracao
; Coloque este arquivo em: Data/SKSE/Plugins/RarityForge.ini
; (no MO2: dentro da pasta do mod, em SKSE/Plugins/)
; Linhas com ; no inicio sao comentarios.

; 1 = ativa, 0 = desativa
OnlyWhenCrafting=1
AffectWeapons=1
AffectArmor=1
Notify=1

; Multiplica o valor gravado no item. Deixe 1.0 no primeiro teste.
; Se o dano/armadura ficar diferente do esperado, ajustamos por aqui.
HealthScale=1.0

