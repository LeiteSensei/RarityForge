; Overgeared v3 (prototipo de copias) - configuracao
; Coloque em: Data/SKSE/Plugins/Overgeared.ini (no MO2: dentro da pasta do mod, em SKSE/Plugins/)
; Linhas com ; no inicio sao comentarios.
;
; Cada raridade tem uma chance e valores para cada atributo:
;   Damage        = multiplicador de dano (sorteado entre Min e Max, em passos de 0.01)
;   Value         = multiplicador de valor de venda (sorteado)
;   WeightDivisor = FIXO por raridade. O peso da arma e dividido por este numero.
;                   Ex: 3.00 = a arma fica 3 vezes mais leve.
;   Speed         = multiplicador de velocidade de ataque (sorteado)
;   Armor         = multiplicador de DEFESA das armaduras (sorteado). Valor e peso valem tambem para armaduras.
;   CritBonus     = bonus SOMADO ao multiplicador do DANO CRITICO (sorteado).
;                   Multiplicador final = 1 + bonus. Ex: bonus 2.00 = dano critico 3x.
;                   O dano critico e o valor fixo que a arma soma ao acerto critico.
;                   Ele e calculado a partir do dano NOVO da arma (metade, como no jogo
;                   normal) e depois multiplicado por este valor.
; Observacao: dano, valor e dano critico sao numeros inteiros no jogo, entao em
; armas de numeros baixos o resultado e arredondado.
; Os nomes estao sem acento de proposito (a fonte do jogo pode nao exibir).

; 1 = ativa, 0 = desativa
OnlyWhenCrafting=1
Notify=1
AffectWeapons=1
AffectArmor=1
; Roupas e joias/acessorios (aneis, amuletos, oculos...) usam os mesmos sliders das armaduras.
AffectClothing=1
AffectJewelry=1

; ---------------- Janela de resultado ----------------
; Mostra uma caixa de mensagem com os atributos antes e depois, quando a forja fecha.
; ResultMinRarity: 1=Comum 2=Rara 3=Epica 4=Lendaria 5=Mitica (aparece a partir desta)
ResultWindow=1
ResultMinRarity=1
; ResultMaxItems: quantos itens cabem na mesma janela (a caixa do jogo tem pouco espaco; 2 costuma caber)
ResultMaxItems=2

; ---------------- Refino (TESTE) ----------------
; Cria uma receita para melhorar o item na pedra de amolar (armas) ou na mesa de armaduras.
; RefineMinRarity/RefineMaxRarity: faixa de raridades que ganham a receita (1=Comum ... 5=Mitica).
; RefineItemID: FormID do item exigido, em hexadecimal. 0x0005ACE4 = Lingote de Ferro (so para teste).
; Obs.: o jogo usa a MESMA receita em todos os niveis de melhoria do item.
; ---------------- Avaliador ----------------
; Com o inventario aberto, aperte a tecla para sortear a raridade de um item que voce ja tem.
; O inventario fecha, o item e trocado e a janela de resultado aparece.
; AppraiseKey: codigo de tecla DirectInput (24 = O, 25 = P, 0 = desligada).
;   Atencao: digitar a letra na busca do inventario tambem aciona.
AppraiseEnabled=1
AppraiseKey=24

RefineEnabled=1
RefineMinRarity=3
RefineMaxRarity=3
RefineItemID=0x0005ACE4
RefineItemCount=1

; ---------------- Armaduras: limites de defesa ----------------
; ArmorMaxMultiplier = bonus maximo de defesa em relacao a base (0 = sem limite).
;   Vale para todas as pecas, e e o que protege conjuntos grandes.
; Cap* = teto de defesa EXIBIDA no inventario, por tipo de peca (0 = sem teto).
;   O teto nunca reduz uma peca abaixo da defesa que ela ja tinha.
;   Referencia do jogo: 80% de reducao de dano maximo, atingido por volta de
;   567 de defesa exibida no total (ja contando habilidade e perks).
ArmorMaxMultiplier=2.00
CapBody=80
CapHead=45
CapHands=45
CapFeet=45
CapShield=70
CapOther=45

