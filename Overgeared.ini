; Overgeared - configuration
; Location: Data/SKSE/Plugins/Overgeared.ini  (with Mod Organizer 2: inside the mod folder, SKSE/Plugins/)
; Lines starting with ; are comments. Most of these options can also be changed in-game from the
; SKSE Menu Framework page ("Overgeared") and saved back to this file.
;
; Every rarity has a chance and a range for each stat. Values are rolled in 0.01 steps inside the range.
;   Damage        = weapon damage multiplier
;   Value         = sell value multiplier (weapons, armor, clothing, accessories)
;   WeightDivisor = FIXED per rarity. The item's weight is divided by this number (3.00 = three times lighter).
;   Speed         = weapon attack speed multiplier
;   CritBonus     = bonus ADDED to the critical damage multiplier (final multiplier = 1 + bonus).
;                   Critical damage is calculated from the weapon's NEW damage (half of it on most weapons).
;   Armor         = armor defense multiplier (rolled range, see the defense limits below)
; Damage, value and critical damage are whole numbers in the game, so low-number items are rounded.

; 1 = on, 0 = off
OnlyWhenCrafting=1
Notify=1
AffectWeapons=1
AffectArmor=1
; Clothing and jewelry/accessories (rings, amulets, glasses...) use the same sliders as armor.
AffectClothing=1
AffectJewelry=1

; ---------------- Result window ----------------
; A message box with the item's stats before and after, shown when the crafting menu closes.
; ResultMinRarity (crafting only): 1=Common 2=Rare 3=Epic 4=Legendary 5=Mythic
; ResultMaxItems: how many items fit in one window (the box has little room; 2 usually fits)
ResultWindow=1
ResultMinRarity=1
ResultMaxItems=2

; ---------------- Appraiser ----------------
; With the inventory open, press the key to roll a rarity for an item you already own.
; The inventory closes, the item is swapped, and the result window appears.
; AppraiseWindow: result window when appraising (always shown, independent of ResultMinRarity)
; AppraiseKey: DirectInput key code (24 = O, 25 = P, 0 = disabled).
;   Note: typing that letter in the inventory search box also triggers it.
; BlockLossyItems: 1 = refuse items that would lose data in the swap (improved, stolen, renamed,
;   poisoned, player-made enchantments). 0 = appraise them anyway (that data is lost).
;   Equipped items are always refused. Enchantments that come with the item are always kept.
AppraiseEnabled=1
AppraiseWindow=1
AppraiseKey=24
BlockLossyItems=0

; ---------------- Armor: defense limits ----------------
; ArmorMaxMultiplier = maximum defense bonus relative to the piece's base defense (0 = no limit).
;   It applies to every piece and protects big sets.
; Cap* = cap on the DISPLAYED defense per piece type (0 = no cap).
;   The cap never lowers a piece below the defense it already had.
;   Game reference: the maximum 80% damage reduction is reached around 567 total displayed armor
;   (skills and perks included).
ArmorMaxMultiplier=2.00
CapBody=80
CapHead=45
CapHands=45
CapFeet=45
CapShield=70
CapOther=45

; ---------------- Improvement recipes ----------------
; Rarity items get a recipe at the grindstone (weapons) and the armor workbench (armor), so they can
; be improved like any other item. The game uses the SAME recipe for every improvement step.
; One line per rarity, format: [plugin|]hexFormID:count, [plugin|]hexFormID:count, ...
; The plugin name defaults to Skyrim.esm, so mod items can be used too (e.g. MyMod.esp|0000ABCD:2).
; Items used by default (all Skyrim.esm):
;   0005ACE4 Iron Ingot        000DB8A2 Dwarven Metal Ingot   0005AD9E Gold Ingot
;   0005ADA1 Malachite Ingot   0005AD9D Ebony Ingot           0005AD99 Orichalcum Ingot
;   Soul gems (FILLED, used by default): 0002E4F3 Common, 0002E4FF Grand, 0002E504 Black
;   Soul gems (EMPTY): 0002E4E6 Common, 0002E4FC Grand, 0002E500 Black
; RefineEnabled=0 turns the recipes off.
RefineEnabled=1
RefineRecipe1=Skyrim.esm|0005ACE4:3
RefineRecipe2=Skyrim.esm|0005ACE4:5, Skyrim.esm|000DB8A2:2
RefineRecipe3=Skyrim.esm|000DB8A2:5, Skyrim.esm|0005AD9E:5, Skyrim.esm|0002E4F3:1
RefineRecipe4=Skyrim.esm|0005AD9E:10, Skyrim.esm|0005ADA1:5, Skyrim.esm|0002E4FF:1
RefineRecipe5=Skyrim.esm|0005AD9D:15, Skyrim.esm|0005ADA1:5, Skyrim.esm|0005AD99:5, Skyrim.esm|0002E504:1

