; Overgeared v3 (prototipo de copias) - configuracao
; Coloque em: Data/SKSE/Plugins/Overgeared.ini (no MO2: dentro da pasta do mod, em SKSE/Plugins/)
; Linhas com ; no inicio sao comentarios.
;
; Cada raridade tem uma chance e valores para cada atributo:
;   Damage        = multiplicador de dano (sorteado entre Min e Max, em passos de 0.01)
;   Value         = multiplicador de valor de venda (sorteado)
;   WeightDivisor = FIXO por raridade. O peso da arma e dividido por este numero.
;                   Ex: 3.00 = a arma fica 3 vezes mais leve.
;   Speed         = multiplicador de velocidade de ataque (sorteado)
;   CritBonus     = bonus SOMADO ao multiplicador do DANO CRITICO (sorteado).
;                   Multiplicador final = 1 + bonus. Ex: bonus 2.00 = dano critico 3x.
;                   O dano critico e o valor fixo que a arma soma ao acerto critico.
;                   Ele e calculado a partir do dano NOVO da arma (metade, como no jogo
;                   normal) e depois multiplicado por este valor.
; Observacao: dano, valor e dano critico sao numeros inteiros no jogo, entao em
; armas de numeros baixos o resultado e arredondado.
; Os nomes estao sem acento de proposito (a fonte do jogo pode nao exibir).

; 1 = ativa, 0 = desativa
OnlyWhenCrafting=1
Notify=1

